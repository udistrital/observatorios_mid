[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "observatorios_mid"
version = "0.1.0"
description = "API Observatorios MID"
requires-python = ">=3.13"

dependencies = [
  "Flask==3.1.2",
  "Flask-Cors==6.0.1",
  "flask-restx==1.3.2",
  "PyYAML==6.0.3",
  "requests==2.32.4",
  "gunicorn"
]